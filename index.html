<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Play / Pause Fernbedienung</title>
<style>
:root{--bg:#0e0e0e;--ink:#f4f4f4;--dim:#8a8a8a;--play:#1fd17a;--pause:#ff9f1a;--red:#e4002b}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;gap:12px}
header b{font-size:15px;letter-spacing:.02em}
#status{font-size:14px;color:var(--dim);display:flex;align-items:center;gap:8px}
#status i{width:10px;height:10px;border-radius:50%;background:var(--red);display:inline-block}
#status.on i{background:var(--play)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:24px;text-align:center}
h1{font-size:clamp(28px,5vw,44px);line-height:1.1}
.choose{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;width:min(560px,100%)}
button{font:inherit;color:inherit;border:0;cursor:pointer;border-radius:18px}
.choose button{background:#1c1c1c;padding:28px 20px;font-size:20px;font-weight:600}
.choose button span{display:block;font-size:14px;font-weight:400;color:var(--dim);margin-top:6px}
.choose button:hover,.choose button:focus-visible{background:#2a2a2a;outline:2px solid #555}
.hide{display:none!important}
/* Anzeige */
#icon{width:min(60vmin,520px);height:min(60vmin,520px)}
#icon svg{width:100%;height:100%}
#pair{display:flex;gap:28px;align-items:center;flex-wrap:wrap;justify-content:center}
#qr{background:#fff;padding:12px;border-radius:12px}
#qr img,#qr canvas{display:block;width:180px;height:180px}
.code{font-size:clamp(40px,8vw,72px);font-weight:800;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.small{font-size:14px;color:var(--dim)}
#lat{font-variant-numeric:tabular-nums}
/* Fernbedienung */
#join{display:flex;gap:10px;width:min(420px,100%)}
#join input{flex:1;font:inherit;font-size:24px;text-transform:uppercase;letter-spacing:.15em;text-align:center;padding:12px;border-radius:14px;border:2px solid #333;background:#161616;color:var(--ink)}
#join button{background:var(--ink);color:var(--bg);padding:0 22px;font-weight:700}
#pads{display:grid;grid-template-rows:1fr 1fr;gap:16px;width:min(480px,100%);height:min(70vh,560px)}
#pads button{font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:16px;touch-action:manipulation;transition:transform .06s}
#pads button:active{transform:scale(.97)}
#bPlay{background:var(--play);color:#04210f}
#bPause{background:var(--pause);color:#2b1700}
#pads button svg{width:48px;height:48px}
#pads.off button{opacity:.35}
.link{color:var(--dim);background:none;font-size:14px;text-decoration:underline;padding:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{from{transform:scale(.85);opacity:.4}to{transform:scale(1);opacity:1}}
.pop{animation:pop .12s ease-out}
</style>
</head>
<body>
<header><b>Play / Pause</b><div id="status"><i></i><span id="stxt">nicht verbunden</span></div></header>

<main id="vStart">
  <h1>Was ist dieses Gerät?</h1>
  <div class="choose">
    <button id="cRecv">Anzeige<span>Rechner – zeigt Play/Pause an</span></button>
    <button id="cSend">Fernbedienung<span>Telefon – sendet Play/Pause</span></button>
  </div>
</main>

<main id="vRecv" class="hide">
  <div id="icon"></div>
  <div id="pair">
    <div id="qr"></div>
    <div><div class="small">Kopplungscode</div><div class="code" id="code">······</div>
    <div class="small">QR-Code mit dem Telefon scannen<br>oder Code in der Fernbedienung eingeben</div></div>
  </div>
  <div class="small" id="lat"></div>
  <button class="link" id="newCode">Neuen Code erzeugen</button>
</main>

<main id="vSend" class="hide">
  <form id="join"><input id="inCode" maxlength="6" autocomplete="off" placeholder="CODE" inputmode="text"><button>Koppeln</button></form>
  <div id="pads" class="off">
    <button id="bPlay"><svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor"/></svg>Play</button>
    <button id="bPause"><svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/></svg>Pause</button>
  </div>
  <div class="small" id="lat2"></div>
  <button class="link" id="back">Gerätetyp wechseln</button>
</main>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const PRE='pp-rmt-';
const ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const ICONS={
  idle:'<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#333" stroke-width="4"/><path d="M38 28v44l34-22z" fill="#333"/></svg>',
  play:'<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#1fd17a"/><path d="M38 27v46l36-23z" fill="#04210f"/></svg>',
  pause:'<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#ff9f1a"/><path d="M33 28h12v44H33zM55 28h12v44H55z" fill="#2b1700"/></svg>'
};
let peer=null,conn=null,pingT=null;

function status(on,txt){$('status').classList.toggle('on',on);$('stxt').textContent=txt}
function show(v){for(const x of ['vStart','vRecv','vSend'])$(x).classList.toggle('hide',x!==v)}
function newCode(){let s='';const r=crypto.getRandomValues(new Uint8Array(6));for(const b of r)s+=ALPH[b%ALPH.length];return s}
function setIcon(k){const el=$('icon');el.innerHTML=ICONS[k];el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}
function kill(){clearInterval(pingT);try{conn&&conn.close()}catch(e){}try{peer&&peer.destroy()}catch(e){}peer=conn=null}

/* ---------- Anzeige (Rechner) ---------- */
function startRecv(fresh){
  kill();show('vRecv');store.set('pp-role','recv');
  let code=!fresh&&store.get('pp-code')||newCode();store.set('pp-code',code);
  $('code').textContent=code;setIcon('idle');$('lat').textContent='';
  const url=location.href.split(/[?#]/)[0]+'?c='+code;
  $('qr').innerHTML='';$('qr').classList.remove('hide');
  if(!/^https?:$/.test(location.protocol)){$('qr').classList.add('hide')}
  else try{new QRCode($('qr'),{text:url,width:180,height:180,correctLevel:QRCode.CorrectLevel.M})}catch(e){$('qr').classList.add('hide')}
  status(false,'warte auf Telefon …');
  peer=new Peer(PRE+code,{debug:0});
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){status(false,'Code belegt – neuer Code');setTimeout(()=>startRecv(true),400)}
    else{status(false,'Fehler: '+e.type);setTimeout(()=>startRecv(false),2000)}
  });
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  peer.on('connection',c=>{
    if(conn&&conn.open)try{conn.close()}catch(e){}
    conn=c;
    c.on('open',()=>{status(true,'Telefon verbunden');$('pair').classList.add('hide');$('newCode').classList.add('hide')});
    c.on('data',d=>{
      if(!d||typeof d!=='object')return;
      if(d.t==='ping'){c.send({t:'pong',s:d.s});return}
      if(d.t==='lat'){$('lat').textContent='Verzögerung ca. '+d.v+' ms';return}
      if(d.t==='play'||d.t==='pause'){setIcon(d.t);c.send({t:'ack',a:d.t,s:d.s})}
    });
    c.on('close',()=>{if(conn===c){conn=null;status(false,'Telefon getrennt – warte …');$('pair').classList.remove('hide');$('newCode').classList.remove('hide')}});
  });
}

/* ---------- Fernbedienung (Telefon) ---------- */
function startSend(code){
  kill();show('vSend');store.set('pp-role','send');
  $('pads').classList.add('off');$('lat2').textContent='';
  if(!code){status(false,'Code eingeben');$('join').classList.remove('hide');return}
  code=code.toUpperCase().replace(/[^A-Z0-9]/g,'');$('inCode').value=code;store.set('pp-target',code);
  status(false,'verbinde …');
  peer=new Peer({debug:0});
  peer.on('open',()=>{
    const c=peer.connect(PRE+code,{reliable:true,serialization:'json'});conn=c;
    const to=setTimeout(()=>{if(!c.open){status(false,'Anzeige nicht erreichbar – neuer Versuch');startSend(code)}},8000);
    c.on('open',()=>{
      clearTimeout(to);status(true,'verbunden mit '+code);$('pads').classList.remove('off');$('join').classList.add('hide');
      const ping=()=>c.open&&c.send({t:'ping',s:performance.now()});ping();pingT=setInterval(ping,3000);
    });
    c.on('data',d=>{
      if(d&&d.t==='pong'){const v=Math.round((performance.now()-d.s)/2);$('lat2').textContent='Verzögerung ca. '+v+' ms';c.send({t:'lat',v})}
      if(d&&d.t==='ack'&&navigator.vibrate)navigator.vibrate(15);
    });
    c.on('close',()=>{if(conn===c){status(false,'getrennt – verbinde neu …');$('pads').classList.add('off');clearInterval(pingT);setTimeout(()=>startSend(code),1000)}});
  });
  peer.on('error',e=>{
    if(e.type==='peer-unavailable'){status(false,'Anzeige '+code+' nicht online');$('join').classList.remove('hide');setTimeout(()=>{if(!conn||!conn.open)startSend(code)},3000)}
    else status(false,'Fehler: '+e.type);
  });
}
function send(t){if(conn&&conn.open)conn.send({t,s:performance.now()})}

/* ---------- Events ---------- */
$('cRecv').onclick=()=>startRecv(false);
$('cSend').onclick=()=>startSend(store.get('pp-target'));
$('newCode').onclick=()=>startRecv(true);
$('back').onclick=()=>{kill();store.del('pp-role');status(false,'nicht verbunden');show('vStart')};
$('join').onsubmit=e=>{e.preventDefault();startSend($('inCode').value)};
for(const [id,t] of [['bPlay','play'],['bPause','pause']]){
  $(id).addEventListener('pointerdown',e=>{e.preventDefault();send(t)});   // pointerdown statt click: spart ~50–100 ms
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&store.get('pp-role')==='send'&&(!conn||!conn.open))startSend(store.get('pp-target'))});

const q=new URLSearchParams(location.search).get('c');
if(q)startSend(q);
else if(store.get('pp-role')==='recv')startRecv(false);
else if(store.get('pp-role')==='send')startSend(store.get('pp-target'));
}
</script>
</body>
</html>
